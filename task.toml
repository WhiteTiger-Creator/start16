name = "training-resume-planner"

[metadata]
author_name = "Jonathan"
author_email = "jtolbert0175@gmail.com"
difficulty_explanation = '''Restarting this run is the work of a training-platform or ML-infrastructure engineer picking up after a botched storage migration, and it is a dependent chain rather than a single repair. All of the data is synthetic: the checkpoint entries, the shard catalogue, the incident record and the run log were generated for this task and describe no real cluster, model or person. The migration left /app/data/checkpoint_registry.json holding a truncated prefix of the registry, so the first step is to rebuild it by replaying the migrator journal onto the pre-migration snapshot under the board's final recovery decision -- an amendment overwriting a field in place, an invalidation taking an entry out while the migrator keeps it as it then stood, and a reinstatement returning exactly that held state so an amendment posted while the entry was out is lost. Which checkpoints survive that replay decides which of them are complete, so every later judgement rests on it. Only then can the resume dialect be reconstructed, and the run log is written the way a training board actually writes: it records where the board departed from the intuitive reading and never restates what a checkpoint, a rank or an epoch means. Three February drafts were reversed in the May review and one March interim was revised, so every rule must be traced to its FINAL dated decision: a checkpoint is complete only when every rank holds BOTH its model and its optimizer shard rather than the model alone, the resume point rolls back to the highest complete checkpoint written STRICTLY BEFORE the first poisoned epoch rather than taking the newest complete one, every shard of a poisoned epoch is re-fetched whatever its checksum says, and the re-fetch queue is taken oldest-epoch first rather than largest-shard first. The second of those is the one that decides the answer: the newest complete checkpoint on the shipped data sits at step 80000, while the governed resume point is step 20000, because everything after step 27000 has already trained on the corrupt shards. An engine that gets completeness right and the rollback wrong proposes a restart that quietly reintroduces the very corruption the incident was raised for.'''
solution_explanation = '''solution/solve.sh drives the two dependent steps inside the environment container. Step one runs solution/recover_registry.go, which implements the board's final recovery decisions (#ML-6170 and #ML-6174): it starts from /app/data/registry_snapshot_pre_migration.json, replays /app/data/registry_journal.json in ascending seq, applies an amendment in place, holds an invalidated entry aside as it then stood, returns exactly that held state on a reinstatement, ignores a change naming an unknown entry, and writes the survivors over the truncated /app/data/checkpoint_registry.json ascending by step, rank, kind and entry id. Step two copies solution/plan_resume_fixed.go over /app/workflow/plan_resume.go and runs it. The planner groups the registry by step, marks a checkpoint complete only where every rank of the configured world holds both a model and an optimizer shard (#ML-6182), derives the first poisoned step from the incident record as the earliest poisoned epoch times steps_per_epoch and admits only checkpoints strictly before it, taking the highest as the resume point (#ML-6186), collects every shard whose stored checksum disagrees with the catalogue plus every shard of a poisoned epoch (#ML-6190), orders that set by ascending epoch then shard id and admits shards until either the byte budget or the shard cap is reached, deferring the rest in the same order (#ML-6194), and emits summary.json, resume_plan.json and refetch_queue.jsonl in the contracted orders (#ML-6196).'''
verification_explanation = '''The separate verifier (tests/Dockerfile builds an isolated image the agent cannot see) collects the agent's whole /app as the declared artifact and runs tests/test_outputs.py against it. Step one is graded directly: the rebuilt registry must match the sealed digest and entry count, carry only the eight declared fields with no migrator bookkeeping surviving, and leave the snapshot, journal, catalogue and incident record byte-identical. The verifier re-derives the misreadings of the replay from those same sources -- a plain concatenation, a replay in file order rather than by sequence, and one where a reinstatement re-reads the snapshot instead of the held state -- and requires each to differ from the governed result. Step two recompiles the agent's submitted /app/workflow/plan_resume.go from source with go build rather than trusting any delivered binary, runs it under an unprivileged uid (65534 via setpriv, a scrubbed environment, inputs staged into a candidate-writable work area) on both the recovered registry and a held-out alternate registry, and compares summary.json in full plus SHA-256 digests of resume_plan.json and refetch_queue.jsonl against sealed fixtures generated from the reference. Crafted micro-instances pin each reversed rule independently: one proves a rank missing its optimizer shard leaves the checkpoint incomplete, one proves the resume point rolls back behind the first poisoned step rather than taking the newest complete checkpoint, one puts every complete checkpoint at or after that step and requires resume_step to read -1 rather than the highest complete one -- the case a two-pass patch that walks back only where the walk-back finds something gets wrong, and the only world in the suite with no clean checkpoint underneath to fall back to, one proves a poisoned shard is re-fetched even where its checksum agrees, and one proves the queue is ordered by epoch rather than by size. The output-directory precondition is graded on the diagnostic as well as the status: a run handed a directory holding an entry it cannot remove has to name that path on standard error and exit non-zero without writing an artifact, so a run that fails silently -- leaving an operator a non-zero status and nothing to act on -- is caught alongside one that writes its three files beside content it could not clear. The two graded runs restore the shipped policy, incident record and shard catalogue before they execute, so a partial or reordered run cannot grade them against a world a crafted probe left on disk. The run is timed against the ninety-second budget the contract publishes. The frozen snapshot /app/workflow/.plan_resume.original.go is asserted present by hash and wrong by output. A failed clearing is graded on all three artifacts rather than on summary.json alone, since checking one name graded the write order rather than the rule, and nothing is asserted about what the run puts on standard output, which the contract does not speak to. The clearing probe plants a stale symlink to a file and one to a directory beside the stale file, so a cleanup that steps over links leaves a fourth entry and is caught, with the link targets required intact afterwards because what is cleared is the entry rather than what it points at. A crafted catalogue lists one epoch's shards backwards to separate the order the contract names from the file's own order under a stable sort on the epoch alone, and the build environment is written out rather than inherited so a GOOS or GOARCH left in the surrounding environment cannot cross-compile a correct submission into a binary the verifier cannot run. The output directory is graded on both of the branches the instruction names: the clearing probes hand the run a directory that already holds a stale file, and one further probe hands it a path whose parent does not exist either and requires the run to create the chain, exit nought and leave the sealed artifacts there, so a planner that refused a directory it could not stat is caught rather than passed. The one-file constraint is graded as behaviour rather than as build shape: the planner may not import os/exec, plugin or C, reach os.StartProcess or syscall's process calls, or carry a go:linkname directive, and one full graded run is made with every file under /app that is not a declared input or the planner itself moved aside, so a wrapper over a helper left beside it produces the same plan or it produces none. Three further rules the instruction states but nothing graded are graded now: /app/data is inventoried rather than merely digested, so a backup or a staging file left beside the registry is caught where six per-file digests saw nothing; the planner is run with a --catalog, a --incident, a --policy and a --registry option in turn and has to refuse each, since an input the contract fixes at an absolute path is not one a flag may move; and the clearing probe now plants a removable non-empty subdirectory beside the stale file and the links, which a cleanup unlinking one entry at a time rather than removing it recursively fails. Three checks close what the interface and build rules left open. The options the planner declares are read off the program itself -- the flag package prints them when it refuses -h -- and the set has to be exactly --input and --output-dir, since probing four guessed names caught those four spellings and let a --catalog-path through. The process-delegation scan is spelled against the name each file binds rather than against the package name, so `import sc "syscall"` followed by `sc.Exec` no longer slips past a search for the literal syscall.Exec, and the raw Syscall6/RawSyscall6/Syscall9 family is named alongside the rest. And the owner sweep that proves no candidate process outlives its run skips a zombie: a killed orphan keeps its owner in the process table until this container's init reaps it, so counting zombies made one isolation test wait on another process's scheduling. Confirmed locally in the real two-container flow: after solve.sh the verifier gives reward 1, a fresh environment with no solve.sh gives 0, and so does an environment where the planner is repaired but the registry is never rebuilt.'''
relevant_experience = '''Working knowledge of distributed training infrastructure as a discipline -- sharded checkpoints, rank-parallel writes, optimizer state, epoch-to-step arithmetic and data-integrity incidents taken as read rather than looked up -- plus experience rebuilding a checkpoint registry by replaying a migration journal onto a snapshot, and reconstructing a restart policy from an authoritative but noisy run log that records only the board's departures from the intuitive reading, tracing incrementally-revised rules to their final form and matching a strict output contract in Go.'''
